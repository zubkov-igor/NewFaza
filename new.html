<!DOCTYPE html>

	<link rel="stylesheet" href="styles/index.css">
	<link rel="icon" href="img/logo.ico" type="image/x-icon">

	<title>New Faza - </title>

<body>
	<div class="wrapper">
		<header class="header">
			<div id="message"></div>

			<div class="main__content">
				<div class="block">
				<div class="block__menu">
			<a href="index.html"><button class="profile__back back-button" type="button">

            <button type="button" class="block-item_button">Сохранить</button>
			
			<a href="online.html"><button class="block-item_button">Пуск</button></a>

				</div>
			</div>

		<footer class="footer">

        </footer>
