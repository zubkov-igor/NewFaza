<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    <script defer src="scripts/modbus.js"></script>
    <script defer src="scripts/connect.js"></script>
    <title>New Faza</title>
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <h1>New Faza</h1>
        </header>
        <main class="main">
            <div class="main__content">
                <div class="main__block">

                    <div class="block-item">

                        <a href="online.html"><button class="block-item_button">Онлайн</button></a>
                        <a href="archive.html"><button class="block-item_button">Архив</button></a>
                        <a href="server.html"><button class="block-item_button">Сервер</button></a>
                    </div>
                    <div class="block-item-center">
                        <div class="button__online" id="statusButton"><img class="icon" src="img/drill.png" alt=""></div>
                        <div class="button__online" id="indicator"><img class="icon" src="img/server.png" alt=""></div>
                    </div>
                    <div class="block-item">
                        <a href="settings.html"><button class="block-item_button">Настройка</button></a>
                        <a id="open-exe-link" href="#"><button class="block-item_button">Панель оператора</button></a>
                        <a href="https://faza2412.ru/" target="_blank"><button class="block-item_button">SCADA</button></a>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <span>Copyright &copy; 2024</span>
        </footer>
    </div>
    <script>
        const {
            ipcRenderer
        } = require('electron');
        document.getElementById('open-exe-link').addEventListener('click', (event) => {
            event.preventDefault();
            ipcRenderer.send('open-exe-file', 'fazaviewer.exe');
        });
    </script>
</body>

</html>
