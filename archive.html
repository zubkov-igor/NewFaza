<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <script src="libs/date.js"></script>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    <title>New Faza - архив</title>
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <h1>New Faza - архив</h1>
        </header>
        <main class="main">

            <div class="main__content">
                <div class="block">
                    <div class="block__menu">
                        <a href="index.html"><button class="profile__back back-button" type="button">
                                <svg class="back-button__icon" viewBox="0 0 320 512" height="18" width="18">
                                    <path fill="currentColor" d="M41.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 256 246.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z" />
                                </svg>
                            </button></a>
                        <button class="block-item_button" id="csvFile">Открыть CSV файл</button>
                        <button class="block-item_button" id="save">Сохранить как PNG</button>

                        <span class="switch">
                            <input type="checkbox" class="switch__input" role="switch" name="switch1" id="toggleRadius" />
                            <span class="switch__fill" aria-hidden="true">
                                <span class="switch__text">ON</span>
                                <span class="switch__text">OFF</span>
                            </span>
                        </span>


                        <div id="file-path"></div>
                    </div>
                    <div class="block__main">
                        <div id="spinner" class="spinner" style="display: none;">

                            <div class="loader"></div>
                        </div>

                        <canvas id="archive">

                        </canvas>
                    </div>
                </div>
        </main>
        <footer class="footer">
            <div id="hidden">
                <div class="footer__container">
                    <div class="form-container">
                        <div class="form-row">
                            <div class="row-group">
                                <div id="message"></div>
                                <select id="chartSelect">
                                    <option value="">Выберите график</option>
                                </select> <input type="text" class="number" id="value1" min="0" required>
                                <input type="text" class="number" id="value2" min="0" required>
                                <button class="block-item_button" id="updateValues" disabled>Обновить график</button>
                                <div class="vline"></div>
                            </div>
                            <div class="form-row">

                                <form id="editForm">
                                    <div class="form-group">
                                        <input type="text" id="client" name="client" value="">
                                    </div>
                                    <div class="form-group">
                                        <input type="text" class="number" id="bush" name="bush" value="">
                                    </div>
                                    <div class="form-group">
                                        <input type="text" class="number" id="well" name="well" value="">
                                    </div>
                                    <div class="form-group">
                                        <input type="text" id="work" name="work" value="">
                                    </div>
                                    <button class="block-item_button" type="submit">Сохранить</button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script>
        function validateInput(inputField) {
            inputField.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9,]/g, '');
            });
        }

        const inputField1 = document.getElementById('value1');
        const inputField2 = document.getElementById('value2');
        const bush = document.getElementById('bush');
        const well = document.getElementById('well');

        validateInput(inputField1);
        validateInput(inputField2);
        validateInput(bush);
        validateInput(well);
    </script>

    <div id="passwordModal" style="display: none;">
        <div class="modalContent">
            <input type="password" id="passwordInput" placeholder="Введите пароль" />
            <button id="submitPassword" style="border: none; background: none; cursor: pointer;">
                <img class="icon" src="img/yes.png" alt="">
            </button>
            <button id="cancelPassword" style="border: none; background: none; cursor: pointer;">
                <img class="icon" src="img/no.png" alt="">
            </button>
        </div>
    </div>

    <script src="scripts/archive.js" defer></script>
</body>

</html>
