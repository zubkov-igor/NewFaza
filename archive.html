<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <script src="libs/date.js"></script>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    <title>New Faza - архив</title>
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <h1>New Faza - архив</h1>
        </header>
        <main class="main">

            <div class="main__content">
                <div class="block">
                    <div class="block__menu">
                        <a href="index.html"><button class="profile__back back-button" type="button">
                                <svg class="back-button__icon" viewBox="0 0 320 512" height="18" width="18">
                                    <path fill="currentColor" d="M41.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 256 246.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z" />
                                </svg>
                            </button></a>
                        <button class="block-item_button" id="csvFile">Открыть CSV файл</button>
                        <button class="block-item_button" id="save">Сохранить как PNG</button>
                        <label>
                            <input type="checkbox" id="hiddenCheck" onclick="toggleDiv()">
                        </label>
                        <div id="file-path"></div>
                    </div>
                    <div class="block__main">
                        <canvas id="archive">

                        </canvas>
                    </div>
                </div>
        </main>
        <footer class="footer">
            <div id="hidden">
            <div class="footer__container">
                <div class="form-container">
                    
                        <div id="message"></div>
                        <select id="chartSelect">
                            <option value="">Выберите график</option>
                        </select>
                        <input type="number" id="value1" pattern="\d*" min="0" required>
                        <input type="number" id="value2" pattern="\d*" min="0" required>
                        <button class="block-item_button" id="updateValues" disabled>Обновить</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script>
        function validateInput(inputField) {
            inputField.addEventListener('input', function() {

                this.value = this.value.replace(/[^0-9]/g, '');


                if (this.value < 0) {
                    this.value = 0;
                    alert("Отрицательные значения не допускаются. Восстановление до 0.");
                }


                if (this.value === '') {
                    this.setCustomValidity("Пожалуйста, введите положительное целое число.");
                } else {
                    this.setCustomValidity("");
                }
            });
        }

        const inputField1 = document.getElementById('value1');
        const inputField2 = document.getElementById('value2');

        validateInput(inputField1);
        validateInput(inputField2);

        function toggleDiv() {
            var checkbox = document.getElementById("hiddenCheck");
            var div = document.getElementById("hidden");

            if (checkbox.checked) {
                div.style.display = "flex";
            } else {
                div.style.display = "none";
            }
        }
    </script>
    <script src="scripts/archive.js" defer></script>
</body>

</html>
